def findGdalBin() {
    def paths = ['C:\\OSGeo4W64\\bin', 'C:\\OSGeo4W\\bin',
                 System.getenv('CATGIS_OSGEO4W') ? "${System.getenv('CATGIS_OSGEO4W')}\\bin" : null]
    for (p in paths) {
        if (p != null && new File(p, 'gdal_translate.exe').exists()) return p
    }
    return '' // not found — GDAL features won't work but app won't crash
}

