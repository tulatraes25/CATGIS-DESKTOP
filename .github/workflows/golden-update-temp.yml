name: Golden Update (temp)

on:
  push:
    branches: [ feat/catmap-render-metrics-scale ]
  workflow_dispatch:

jobs:
  update-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate Linux golden fixture
        env:
          CATGIS_GOLDEN_UPDATE: '1'
        run: |
          cd catgis-desktop
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain test --tests 'ar.com.catgis.catmap.CatmapVisualTest'
      - uses: actions/upload-artifact@v4
        with:
          name: golden-catmap-real-data
          path: catgis-desktop/src/test/resources/ar/com/catgis/catmap/golden/catmap-real-data.png