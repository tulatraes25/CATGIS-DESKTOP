name: CATGIS Main Push Attestation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: catgis-attest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-main-push:
    name: Verify exact main push certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUIRED_MAIN_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Verify CI and Certification push runs and required jobs
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPOSITORY"]
          sha = os.environ["REQUIRED_MAIN_SHA"]
          if not re.fullmatch(r"[0-9a-fA-F]{40}", sha):
              raise SystemExit(f"Unexpected main commit SHA: {sha!r}")

          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "CATGIS-main-push-attestation",
          }

          def request_json(path):
              req = urllib.request.Request(base + path, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read(512).decode("utf-8", "replace")
                  raise RuntimeError(f"GitHub API {path}: HTTP {error.code}: {detail}") from error

          required = {
              "ci.yml": {"Java Desktop Build & Test", "Repository Safety Checks", "Web Viewer Lint"},
              "certification.yml": {
                  "Certification Linux Full Suite", "Certification Windows Full Suite",
                  "PostGIS Real Integration", "Architecture Guardrails",
                  "Visible Command Inventory", "Source Feature Surface Inventory",
              },
          }

          # Read the protected main SHA's OWN workflow, not the PR's updated
          # workflow, so a first platform-introduction PR remains attested
          # against the prior main. After merge, the new platform jobs become
          # mandatory and cannot be skipped in successful main push evidence.
          meta = request_json(
              "/contents/.github/workflows/certification.yml?ref=" + sha)
          if meta.get("encoding") != "base64" or not meta.get("content"):
              raise SystemExit("Cannot inspect exact-main certification.yml")
          cert_source = base64.b64decode(meta["content"]).decode("utf-8")
          optional_platform_jobs = [
              ("linux-appimage-package:",
               {"Linux App Image Package Contract"}),
              ("windows-appimage-package:",
               {"Windows App Image Package Contract"}),
              ("macos-full-suite-appimage:",
               {"Certification macOS Intel Full Suite + App Image",
                "Certification macOS Apple Silicon Full Suite + App Image"}),
              ("native-gdal-real-roundtrip:",
               {"Real Native GDAL Linux", "Real Native GDAL macOS Intel",
                "Real Native GDAL macOS Apple Silicon"}),
          ]
          for workflow_job_id, gate_job_names in optional_platform_jobs:
              if re.search(r"(?m)^  " + re.escape(workflow_job_id) +
                           r"\s*$", cert_source):
                  required["certification.yml"].update(gate_job_names)
                  print("ATTEST REQUIRED protected-main job:", sorted(gate_job_names))

          # An additional independent-format workflow becomes mandatory only
          # after its introduction in the protected main, never retroactively.
          workflow_files = request_json("/contents/.github/workflows?ref=" + sha)
          if not isinstance(workflow_files, list):
              raise SystemExit("Cannot inspect exact-main workflow inventory")
          if any(row.get("name") == "geoparquet-metadata.yml" for row in workflow_files):
              required["geoparquet-metadata.yml"] = {"GeoParquet Independent Metadata Interop"}
              print("ATTEST REQUIRED protected-main GeoParquet independent interoperability")

          report = [f"## CATGIS main push attestation — exact SHA \u0060{sha}\u0060",
                    "", "| Workflow | Run ID | Attempt | Conclusion |",
                    "|---|---:|---:|---|"]
          problems = []

          for workflow, expected_jobs in required.items():
              query = urllib.parse.urlencode(
                  {"head_sha": sha, "event": "push", "per_page": 100})
              data = request_json(f"/actions/workflows/{workflow}/runs?{query}")
              runs = [
                  run for run in data.get("workflow_runs", [])
                  if run.get("head_sha") == sha and run.get("event") == "push"
                  and run.get("head_branch") == "main"
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
              ]
              if not runs:
                  problems.append(f"{workflow}: no completed SUCCESS push run on main at {sha}")
                  report.append(f"| {workflow} | missing | — | BLOCKED |")
                  continue

              success = None
              rejected = []
              for run in sorted(
                  runs, key=lambda row: (row.get("run_number", 0),
                                         row.get("run_attempt", 0)), reverse=True
              ):
                  run_id = run["id"]
                  attempt = run.get("run_attempt", 1)
                  jobs_data = request_json(
                      f"/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100")
                  jobs = {
                      job.get("name"): job
                      for job in jobs_data.get("jobs", [])
                  }
                  missing = sorted(
                      name for name in expected_jobs
                      if jobs.get(name, {}).get("status") != "completed"
                      or jobs.get(name, {}).get("conclusion") != "success"
                  )
                  if missing:
                      rejected.append(f"run {run_id} attempt {attempt} missing PASS jobs: {missing}")
                      continue
                  success = (run, jobs)
                  break

              if success is None:
                  problems.append(f"{workflow}: " + "; ".join(rejected))
                  report.append(f"| {workflow} | no qualifying jobs | — | BLOCKED |")
                  continue

              run, jobs = success
              report.append(
                  f"| [{workflow}]({run['html_url']}) | {run['id']} "
                  f"| {run.get('run_attempt', 1)} | SUCCESS |"
              )
              report.append("")
              report.append(f"Required jobs, {workflow}:")
              for name in sorted(expected_jobs):
                  job = jobs[name]
                  report.append(
                      f"- {name}: SUCCESS (job {job['id']})"
                  )
              report.append("")
              print(f"ATTEST PASS workflow={workflow} main_sha={sha} "
                    f"run_id={run['id']} attempt={run.get('run_attempt', 1)} "
                    f"url={run['html_url']}")
              for name in sorted(expected_jobs):
                  print(f"  PASS job={name} id={jobs[name]['id']}")

          if problems:
              report.extend(["", "### Missing or insufficient evidence"])
              report.extend(f"- {reason}" for reason in problems)
              for reason in problems:
                  print("ATTEST BLOCKED:", reason, file=sys.stderr)

          summary_path = os.getenv("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as output:
                  output.write("\n".join(report) + "\n")
          print("\n".join(report))
          if problems:
              sys.exit(1)
          PY
