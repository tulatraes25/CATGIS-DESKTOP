name: CATGIS Main Push Attestation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: catgis-attest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-main-push:
    name: Verify exact main push certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUIRED_MAIN_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Verify CI Certification and runtime-identity push runs
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPOSITORY"]
          sha = os.environ["REQUIRED_MAIN_SHA"]
          if not re.fullmatch(r"[0-9a-fA-F]{40}", sha):
              raise SystemExit(f"Unexpected main commit SHA: {sha!r}")

          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "CATGIS-main-push-attestation",
          }

          def request_json(path):
              req = urllib.request.Request(base + path, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read(512).decode("utf-8", "replace")
                  raise RuntimeError(f"GitHub API {path}: HTTP {error.code}: {detail}") from error

          # BEGIN_ATTESTATION_BINDING_CONTRACT
          def attest_live_main_binding(event_name, event, required_main_sha, live_main_sha,
                                       pr, ancestry, dispatch_ref, dispatch_sha):
              """Reject stale pull-request events, moved refs and unreconciled heads."""
              def require_sha(value, label):
                  if not isinstance(value, str) or not re.fullmatch(r"[0-9a-fA-F]{40}", value):
                      raise ValueError(f"{label} must be a full 40-digit Git SHA")
                  return value.lower()
          
              observed = require_sha(live_main_sha, "live main")
              required = require_sha(required_main_sha, "requested main")
              if observed != required:
                  raise ValueError(f"STALE_MAIN_BASE: event={required} live={observed}")
          
              if event_name == "workflow_dispatch":
                  dispatch = require_sha(dispatch_sha, "workflow dispatch SHA")
                  if dispatch_ref != "refs/heads/main" or dispatch != observed:
                      raise ValueError("DISPATCH_NOT_LIVE_MAIN")
                  return {"main_sha": observed, "head_sha": None, "pr_number": None}
          
              if event_name != "pull_request":
                  raise ValueError(f"UNSUPPORTED_ATTESTATION_EVENT: {event_name}")
          
              number = event.get("number")
              event_pr = event.get("pull_request")
              if isinstance(number, bool) or not isinstance(number, int) or number <= 0:
                  raise ValueError("MISSING_EVENT_PR_NUMBER")
              if not isinstance(event_pr, dict) or not isinstance(pr, dict):
                  raise ValueError("MISSING_PR_EVIDENCE")
              if pr.get("number") != number or pr.get("state") != "open":
                  raise ValueError("CURRENT_PR_NO_LONGER_MATCHES_EVENT")
          
              event_base = require_sha(event_pr.get("base", {}).get("sha"), "event PR base")
              current_base = require_sha(pr.get("base", {}).get("sha"), "live PR base")
              event_head = require_sha(event_pr.get("head", {}).get("sha"), "event PR head")
              current_head = require_sha(pr.get("head", {}).get("sha"), "live PR head")
              if event_pr.get("base", {}).get("ref") != "main" or pr.get("base", {}).get("ref") != "main":
                  raise ValueError("PR_BASE_BRANCH_NOT_MAIN")
              if event_base != observed or current_base != observed:
                  raise ValueError(f"STALE_PR_BASE: event={event_base} pr={current_base} live={observed}")
              if event_head != current_head:
                  raise ValueError(f"STALE_PR_HEAD: event={event_head} live={current_head}")
              if not isinstance(ancestry, dict) or ancestry.get("behind_by") != 0 or ancestry.get("ahead_by", 0) <= 0:
                  raise ValueError("PR_HEAD_NOT_DESCENDED_FROM_LIVE_MAIN")
              return {"main_sha": observed, "head_sha": current_head, "pr_number": number}
          
          
          def eligible_main_push_run(run, main_sha):
              """Pending, failed, misdirected and non-push results are never attestable."""
              return isinstance(run, dict) and (run.get("head_sha") == main_sha
                      and run.get("event") == "push" and run.get("head_branch") == "main"
                      and run.get("status") == "completed" and run.get("conclusion") == "success")
          # END_ATTESTATION_BINDING_CONTRACT

          # Live refs are read from GitHub with the read-only workflow token;
          # no untrusted pull-request checkout or executable PR code is loaded.
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event_payload = json.load(stream)
          event_name = os.environ["GITHUB_EVENT_NAME"]
          live_data = request_json("/git/ref/heads/main")
          live_sha = live_data.get("object", {}).get("sha")
          pr_data = None
          ancestry_data = None
          if event_name == "pull_request":
              event_number = event_payload.get("number")
              if isinstance(event_number, bool) or not isinstance(event_number, int) or event_number <= 0:
                  raise SystemExit("Invalid attestation pull request number")
              pr_data = request_json(f"/pulls/{event_number}")
              current_head = pr_data.get("head", {}).get("sha")
              if not isinstance(current_head, str) or not re.fullmatch(r"[0-9a-f]{40}", current_head):
                  raise SystemExit("Invalid GitHub pull-request head SHA")
              if isinstance(live_sha, str) and re.fullmatch(r"[0-9a-f]{40}", live_sha):
                  ancestry_data = request_json(f"/compare/{live_sha}...{current_head}")
          binding = attest_live_main_binding(
              event_name, event_payload, sha, live_sha, pr_data, ancestry_data,
              os.environ.get("GITHUB_REF"), os.environ.get("GITHUB_SHA"))
          print("ATTEST_BINDING_PASS: main_sha=" + binding["main_sha"]
                + " head_sha=" + str(binding["head_sha"])
                + " pr_number=" + str(binding["pr_number"])
                + " event=" + event_name)

          required = {
              "ci.yml": {"Java Desktop Build & Test", "Repository Safety Checks", "Web Viewer Lint"},
              "certification.yml": {
                  "Certification Linux Full Suite", "Certification Windows Full Suite",
                  "PostGIS Real Integration", "Architecture Guardrails",
                  "Visible Command Inventory", "Source Feature Surface Inventory",
              },
          }

          # Inspect protected-main source, never infer requirements from a PR badge.
          meta = request_json("/contents/.github/workflows/certification.yml?ref=" + sha)
          if meta.get("encoding") != "base64" or not meta.get("content"):
              raise SystemExit("Cannot inspect exact-main certification.yml")
          cert_source = base64.b64decode(meta["content"]).decode("utf-8")
          optional_platform_jobs = [
              ("linux-appimage-package:", {"Linux App Image Package Contract"}),
              ("windows-appimage-package:", {"Windows App Image Package Contract"}),
              ("macos-full-suite-appimage:",
               {"Certification macOS Intel Full Suite + App Image",
                "Certification macOS Apple Silicon Full Suite + App Image"}),
              ("native-gdal-real-roundtrip:",
               {"Real Native GDAL Linux", "Real Native GDAL macOS Intel",
                "Real Native GDAL macOS Apple Silicon"}),
          ]
          for workflow_job_id, gate_job_names in optional_platform_jobs:
              if re.search(r"(?m)^  " + re.escape(workflow_job_id) + r"\s*$", cert_source):
                  required["certification.yml"].update(gate_job_names)
                  print("ATTEST REQUIRED protected-main job:", sorted(gate_job_names))

          # First-introduction PRs attest old main; after merge these are mandatory.
          workflow_files = request_json("/contents/.github/workflows?ref=" + sha)
          if not isinstance(workflow_files, list):
              raise SystemExit("Cannot inspect exact-main workflow inventory")
          if any(row.get("name") == "geoparquet-metadata.yml" for row in workflow_files):
              required["geoparquet-metadata.yml"] = {"GeoParquet Independent Metadata Interop"}
              print("ATTEST REQUIRED protected-main GeoParquet independent interoperability")
          if any(row.get("name") == "runtime-identity.yml" for row in workflow_files):
              required["runtime-identity.yml"] = {
                  "Runtime identity " + platform + str(feature)
                  for platform in ("Linux", "Windows", "MacIntel", "MacArm")
                  for feature in (17, 21)
              }
              print("ATTEST REQUIRED protected-main runtime identity:", sorted(required["runtime-identity.yml"]))

          report = [f"## CATGIS main push attestation - exact SHA `{sha}`",
                    "", "| Workflow | Run ID | Attempt | Conclusion |",
                    "|---|---:|---:|---|"]
          problems = []

          for workflow, expected_jobs in required.items():
              query = urllib.parse.urlencode({"head_sha": sha, "event": "push", "per_page": 100})
              data = request_json(f"/actions/workflows/{workflow}/runs?{query}")
              runs = [run for run in data.get("workflow_runs", [])
                      if eligible_main_push_run(run, sha)]
              if not runs:
                  problems.append(f"{workflow}: no completed SUCCESS push run on main at {sha}")
                  report.append(f"| {workflow} | missing | - | BLOCKED |")
                  continue
              success = None
              rejected = []
              for run in sorted(runs, key=lambda row: (row.get("run_number", 0), row.get("run_attempt", 0)),
                                reverse=True):
                  run_id = run["id"]
                  attempt = run.get("run_attempt", 1)
                  jobs_data = request_json(f"/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100")
                  rows = jobs_data.get("jobs", [])
                  jobs = {job.get("name"): job for job in rows}
                  if len(jobs) != len(rows) or jobs_data.get("total_count", len(rows)) != len(rows):
                      rejected.append(f"run {run_id} attempt {attempt}: duplicate or incomplete job inventory")
                      continue
                  missing = sorted(name for name in expected_jobs
                                   if jobs.get(name, {}).get("status") != "completed"
                                   or jobs.get(name, {}).get("conclusion") != "success")
                  if missing:
                      rejected.append(f"run {run_id} attempt {attempt} missing PASS jobs: {missing}")
                      continue
                  success = (run, jobs)
                  break
              if success is None:
                  problems.append(f"{workflow}: " + "; ".join(rejected))
                  report.append(f"| {workflow} | no qualifying jobs | - | BLOCKED |")
                  continue
              run, jobs = success
              report.append(f"| [{workflow}]({run['html_url']}) | {run['id']} "
                            f"| {run.get('run_attempt', 1)} | SUCCESS |")
              report.extend(["", f"Required jobs, {workflow}:"])
              for name in sorted(expected_jobs):
                  report.append(f"- {name}: SUCCESS (job {jobs[name]['id']})")
              report.append("")
              print(f"ATTEST PASS workflow={workflow} main_sha={sha} "
                    f"run_id={run['id']} attempt={run.get('run_attempt', 1)} url={run['html_url']}")
              for name in sorted(expected_jobs):
                  print(f"  PASS job={name} id={jobs[name]['id']}")

          # Close the ref-movement window before publishing a PASS.
          last_live = request_json("/git/ref/heads/main").get("object", {}).get("sha")
          if last_live != binding["main_sha"]:
              problems.append("LIVE_MAIN_MOVED_DURING_ATTESTATION")
          if binding["pr_number"] is not None:
              last_pr = request_json(f"/pulls/{binding['pr_number']}")
              if last_pr.get("head", {}).get("sha") != binding["head_sha"]:
                  problems.append("PR_HEAD_MOVED_DURING_ATTESTATION")
              if last_pr.get("base", {}).get("sha") != binding["main_sha"]:
                  problems.append("PR_BASE_MOVED_DURING_ATTESTATION")

          if problems:
              report.extend(["", "### Missing or insufficient evidence"])
              report.extend(f"- {reason}" for reason in problems)
              for reason in problems:
                  print("ATTEST BLOCKED:", reason, file=sys.stderr)
          summary_path = os.getenv("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as output:
                  output.write("\n".join(report) + "\n")
          print("\n".join(report))
          if problems:
              sys.exit(1)
          PY
