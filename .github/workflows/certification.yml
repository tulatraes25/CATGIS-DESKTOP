name: CATGIS Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: catgis-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-cache-linux:
    name: Prime Linux dependency cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        id: gradle-deps
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Resolve CI dependencies
        if: steps.gradle-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon resolveCiDependencies; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency resolution failed after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 20))
          done

  dependency-cache-windows:
    name: Prime Windows dependency cache
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        id: gradle-deps
        uses: actions/cache@v4
        with:
          path: D:\a\.gradle\caches\modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Resolve CI dependencies
        if: steps.gradle-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
            & .\gradlew.bat --no-daemon resolveCiDependencies
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { throw "Dependency resolution failed after 3 attempts." }
            Start-Sleep -Seconds ($attempt * 20)
          }

  linux-appimage-package:
    needs: dependency-cache-linux
    name: Linux App Image Package Contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Build and verify Linux app-image with bundled JDK
        run: ./gradlew --offline --no-daemon verifyLinuxAppImage
      - name: Record package metadata only (no binary upload)
        shell: bash
        run: |
          set -euo pipefail
          app='build/installer/linux/app-image/CATGIS Desktop'
          test -x "$app/bin/CATGIS Desktop"
          test -x "$app/lib/runtime/bin/java"
          jar="$(find "$app/lib/app" -maxdepth 1 -name 'catgis-desktop-*.jar' -type f | head -n 1)"
          test -n "$jar"
          echo '### CATGIS Linux runtime-bundled package' >> "$GITHUB_STEP_SUMMARY"
          echo "- app image size: $(du -sh "$app" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- main JAR sha256: $(sha256sum "$jar" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo '- UI runtime/GDAL JNI not yet certified; no binary artifacts uploaded.' >> "$GITHUB_STEP_SUMMARY"

  native-gdal-real-roundtrip:
    name: Real Native GDAL ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Linux
            os: ubuntu-latest
          - variant: macOS Intel
            os: macos-15-intel
          - variant: macOS Apple Silicon
            os: macos-15
    defaults:
      run:
        working-directory: catgis-desktop
    env:
      CATGIS_NATIVE_GDAL_REQUIRED: '1'
      PROJ_NETWORK: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Gradle without uploaded/cache artifacts
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Install real OS-native GDAL CLI without bundling it into git
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gdal-bin
          else
            if ! brew list --versions gdal >/dev/null 2>&1; then
              HOMEBREW_NO_AUTO_UPDATE=1 brew install gdal
            fi
          fi
          for tool in gdal_translate gdalwarp gdalinfo; do
            command -v "$tool" >/dev/null
          done
          bin="$(dirname "$(command -v gdal_translate)")"
          test "${bin:0:1}" = '/'
          for tool in gdal_translate gdalwarp gdalinfo; do test -x "$bin/$tool"; done
          echo "CATGIS_GDAL_BIN=$bin" >> "$GITHUB_ENV"
          gdalinfo --version
          echo "OS=$RUNNER_OS ARCH=$(uname -m) GDAL=$bin"
      - name: Resolve Gradle Java test dependencies with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon resolveCiDependencies; then exit 0; fi
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Run real ASCII Grid to GeoTIFF to XYZ and reprojection
        shell: bash
        run: ./gradlew --offline --no-daemon nativeGdalIntegrationTest
      - name: Verify native GDAL evidence — never skip silently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as E
          results = list(Path('build/test-results/nativeGdalIntegrationTest').glob('TEST-*.xml'))
          if not results:
              raise SystemExit('Missing native GDAL JUnit XML (no silent skip)')
          checks = {k: 0 for k in ('tests', 'failures', 'errors', 'skipped')}
          for path in results:
              suite = E.parse(path).getroot()
              for key in checks:
                  checks[key] += int(suite.attrib.get(key, '0'))
          print('REAL_NATIVE_GDAL:', checks)
          if checks != {'tests': 2, 'failures': 0, 'errors': 0, 'skipped': 0}:
              raise SystemExit('Native GDAL did not execute exactly one successful real integration test')
          PY
          {
            echo '### CATGIS native GDAL raster round-trip PASS'
            echo "- OS: $RUNNER_OS, architecture: $(uname -m)"
            echo "- GDAL bin: $CATGIS_GDAL_BIN"
            echo "- Version: $(gdalinfo --version)"
            echo '- Verified 6 native elevation cells + real 256px north-origin XYZ PNG tiles, TIFF, EPSG:4326 and EPSG:3857 reprojection'
            echo '- No GDAL executables/rasters/packages uploaded as GitHub artifacts'
          } >> "$GITHUB_STEP_SUMMARY"

  macos-full-suite-appimage:
    name: Certification macOS ${{ matrix.variant }} Full Suite + App Image
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Intel
            os: macos-15-intel
            arch: x86_64
          - variant: Apple Silicon
            os: macos-15
            arch: arm64
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install native Java 17 for this Mac architecture
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Gradle without GitHub cache storage
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Confirm real Mac runner architecture
        shell: bash
        env:
          REQUIRED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          echo "Host: $(sw_vers -productVersion); architecture: $actual"
          test "$actual" = "$REQUIRED_ARCH"
      - name: Resolve Mac build dependencies with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon resolveCiDependencies; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Unable to resolve complete macOS runtime/test dependencies.' >&2
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Full macOS headless suite and native .app packaging
        shell: bash
        run: ./gradlew --offline --no-daemon clean verifyMacAppImage test
      - name: Certify full tests, architecture and package layout
        shell: bash
        env:
          REQUIRED_ARCH: ${{ matrix.arch }}
          MAC_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          files = list(Path('build/test-results/test').glob('TEST-*.xml'))
          if not files:
              raise SystemExit('No macOS JUnit XML test reports found')
          counters = {k: 0 for k in ('tests', 'failures', 'errors', 'skipped')}
          for path in files:
              suite = ElementTree.parse(path).getroot()
              for key in counters:
                  counters[key] += int(suite.attrib.get(key, '0'))
          print('macOS JUnit:', counters)
          if counters['tests'] < 700 or counters['failures'] or counters['errors']:
              raise SystemExit('macOS test-count or JUnit failures/errors gate violated')
          if counters['skipped'] > 15:
              raise SystemExit('macOS reviewed test-skip budget exceeded')
          PY
          app='build/installer/macos/app-image/CATGIS Desktop.app'
          catgis="$app/Contents/MacOS/CATGIS Desktop"
          catmap="$app/Contents/MacOS/catmap"
          runtime="$app/Contents/runtime/Contents/Home/bin/java"
          jar="$app/Contents/app/catgis-desktop-1.0.jar"
          test -x "$catgis"
          test -x "$catmap"
          test -x "$runtime"
          test -s "$jar"
          /usr/bin/file -b "$catgis" | tee /tmp/catgis-macos-mach-o.txt
          grep -q 'Mach-O' /tmp/catgis-macos-mach-o.txt
          /usr/bin/lipo -archs "$catgis" | tr ' ' '\n' | grep -Fx "$REQUIRED_ARCH"
          "$runtime" -version
          {
            echo "### CATGIS macOS $MAC_VARIANT package verified"
            echo "- Host architecture: $(uname -m)"
            echo "- Bundle size: $(du -sh "$app" | cut -f1)"
            echo "- Main JAR SHA-256: $(shasum -a 256 "$jar" | cut -d' ' -f1)"
            echo '- JDK17 bundled; CATGIS/CATMAP native launchers and Java tests passed'
            echo '- Unsigned, not notarized; no .app/.dmg binaries uploaded'
          } >> "$GITHUB_STEP_SUMMARY"
  linux-full-suite:
    needs: dependency-cache-linux
    name: Certification Linux Full Suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Full tests and coverage
        run: ./gradlew --offline --no-daemon clean test jacocoTestReport jacocoTestCoverageVerification
      - name: Account tests and skips
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path build/test-results/test -Filter 'TEST-*.xml' -File
          if ($files.Count -eq 0) { throw 'No JUnit XML results found.' }
          $tests = 0; $failures = 0; $errors = 0; $skipped = 0
          foreach ($file in $files) {
            [xml]$xml = Get-Content -LiteralPath $file.FullName -Raw
            $suite = $xml.testsuite
            $tests += [int]$suite.tests
            $failures += [int]$suite.failures
            $errors += [int]$suite.errors
            $skipped += [int]$suite.skipped
          }
          "### CATGIS Linux certification" >> $env:GITHUB_STEP_SUMMARY
          "- tests: $tests" >> $env:GITHUB_STEP_SUMMARY
          "- failures: $failures" >> $env:GITHUB_STEP_SUMMARY
          "- errors: $errors" >> $env:GITHUB_STEP_SUMMARY
          "- skipped: $skipped" >> $env:GITHUB_STEP_SUMMARY
          if ($tests -lt 700) { throw "Unexpected test-count regression: $tests < 700" }
          if ($failures -ne 0 -or $errors -ne 0) { throw 'JUnit failures/errors detected.' }
          # 3 pre-existing reviewed dependency skips + 12 explicit GDAL real-format skips.
          if ($skipped -gt 15) { throw "Linux skip budget exceeded: $skipped > 15" }
      - name: Upload Linux evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: certification-linux
          path: |
            catgis-desktop/build/test-results/test/
            catgis-desktop/build/reports/tests/test/
            catgis-desktop/build/reports/jacoco/
          if-no-files-found: error
          retention-days: 7

  windows-appimage-package:
    needs: dependency-cache-windows
    name: Windows App Image Package Contract
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: D:\a\.gradle\caches\modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Generate and verify both Windows app-image launchers
        shell: pwsh
        run: .\gradlew.bat --offline --no-daemon verifyWindowsAppImage
      - name: Record Windows package evidence (do not upload binaries)
        shell: pwsh
        run: |
          $app = Join-Path (Get-Location) 'build/installer/windows/app-image/CATGIS Desktop'
          $jar = Join-Path $app 'app/catgis-desktop-1.0.jar'
          if (-not (Test-Path -LiteralPath $jar -PathType Leaf)) { throw 'CATGIS Windows main JAR absent.' }
          $bytes = (Get-ChildItem -LiteralPath $app -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $sizeMb = [Math]::Round($bytes / 1MB, 1)
          $hash = (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant()
          '### CATGIS Windows runtime-bundled package' >> $env:GITHUB_STEP_SUMMARY
          "- app image size (MiB): $sizeMb" >> $env:GITHUB_STEP_SUMMARY
          "- main JAR SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
          '- No packaged binary uploaded. Signed installer and GUI launch remain uncertified.' >> $env:GITHUB_STEP_SUMMARY

  windows-full-suite:
    needs: dependency-cache-windows
    name: Certification Windows Full Suite
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: D:\a\.gradle\caches\modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Full headless tests
        shell: pwsh
        run: .\gradlew.bat --offline --no-daemon clean test
      - name: Account Windows tests
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path build/test-results/test -Filter 'TEST-*.xml' -File
          if ($files.Count -eq 0) { throw 'No JUnit XML results found.' }
          $tests = 0; $failures = 0; $errors = 0; $skipped = 0
          foreach ($file in $files) {
            [xml]$xml = Get-Content -LiteralPath $file.FullName -Raw
            $suite = $xml.testsuite
            $tests += [int]$suite.tests
            $failures += [int]$suite.failures
            $errors += [int]$suite.errors
            $skipped += [int]$suite.skipped
          }
          "### CATGIS Windows certification" >> $env:GITHUB_STEP_SUMMARY
          "- tests: $tests" >> $env:GITHUB_STEP_SUMMARY
          "- failures: $failures" >> $env:GITHUB_STEP_SUMMARY
          "- errors: $errors" >> $env:GITHUB_STEP_SUMMARY
          "- skipped: $skipped" >> $env:GITHUB_STEP_SUMMARY
          if ($tests -lt 700) { throw "Unexpected test-count regression: $tests < 700" }
          if ($failures -ne 0 -or $errors -ne 0) { throw 'JUnit failures/errors detected.' }
          # 3 pre-existing reviewed dependency skips + 12 explicit GDAL real-format skips.
          if ($skipped -gt 15) { throw "Windows skip budget exceeded: $skipped > 15" }
      - name: Upload Windows evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: certification-windows
          path: |
            catgis-desktop/build/test-results/test/
            catgis-desktop/build/reports/tests/test/
          if-no-files-found: error
          retention-days: 7

  source-feature-inventory:
    needs: dependency-cache-linux
    name: Source Feature Surface Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Certify source feature-surface inventory
        run: ./gradlew --offline --no-daemon test --tests "ar.com.catgis.architecture.FeatureSurfaceInventoryCertificationTest" --tests "ar.com.catgis.architecture.UiCommandCarrierCoverageCertificationTest" --tests "ar.com.catgis.architecture.SupplementalVisibleCommandInventoryCertificationTest"
      - name: Upload inventory evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: certification-source-feature-inventory
          path: |
            docs/quality/SOURCE_FEATURE_SURFACE_INVENTORY.tsv
            docs/quality/UI_COMMAND_CARRIER_INVENTORY.tsv
            docs/quality/SUPPLEMENTAL_VISIBLE_COMMAND_INVENTORY.tsv
          if-no-files-found: error
          retention-days: 7

  visible-command-inventory:
    needs: dependency-cache-linux
    name: Visible Command Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Certify visible command inventory
        run: ./gradlew --offline --no-daemon test --tests "ar.com.catgis.architecture.VisibleCommandInventoryCertificationTest" --tests "ar.com.catgis.architecture.StaticCommandAliasCertificationTest" --tests "ar.com.catgis.architecture.DynamicCommandInventoryCertificationTest" --tests "ar.com.catgis.architecture.SemanticFeatureMatrixCertificationTest" --tests "ar.com.catgis.architecture.SupplementalCommandSemanticCertificationTest"
      - name: Upload visible command evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: certification-visible-command-inventory
          path: |
            catgis-desktop/build/certification/visible-command-inventory.tsv
            docs/quality/STATIC_COMMAND_ALIAS_MAP.tsv
            docs/quality/DYNAMIC_COMMAND_INVENTORY.tsv
            docs/quality/MODULE_ACTION_INVENTORY.tsv
            docs/quality/STATIC_COMMAND_SEMANTIC_MAP.tsv
            docs/quality/MODULE_ACTION_SEMANTIC_MAP.tsv
            docs/quality/SURFACE_SEMANTIC_MAP.tsv
            docs/quality/SEMANTIC_FEATURE_MATRIX.tsv
            docs/quality/SUPPLEMENTAL_COMMAND_SEMANTIC_MAP.tsv
          if-no-files-found: error
          retention-days: 7

  architecture-guardrails:
    needs: dependency-cache-linux
    name: Architecture Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Run executable architecture contracts
        run: ./gradlew --offline --no-daemon test --tests "ar.com.catgis.architecture.ArchitectureCertificationTest"

  postgis-real:
    needs: dependency-cache-linux
    name: PostGIS Real Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: catgis_test
          POSTGRES_USER: catgis_test
          POSTGRES_PASSWORD: catgis_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catgis_test -d catgis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: catgis-desktop
    env:
      CATGIS_TEST_POSTGIS_HOST: localhost
      CATGIS_TEST_POSTGIS_PORT: '5432'
      CATGIS_TEST_POSTGIS_DB: catgis_test
      CATGIS_TEST_POSTGIS_USER: catgis_test
      CATGIS_TEST_POSTGIS_PASSWORD: catgis_test_password
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Real PostGIS read/write roundtrip
        run: ./gradlew --offline --no-daemon postgisIntegrationTest
      - name: Upload PostGIS evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: certification-postgis
          path: catgis-desktop/build/test-results/postgisIntegrationTest/
          if-no-files-found: error
          retention-days: 7
