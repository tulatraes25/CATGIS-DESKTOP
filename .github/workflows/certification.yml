name: CATGIS Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: catgis-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-cache-linux:
    name: Prime Linux dependency cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        id: gradle-deps
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Resolve CI dependencies
        if: steps.gradle-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon resolveCiDependencies; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency resolution failed after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 20))
          done

  dependency-cache-windows:
    name: Prime Windows dependency cache
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        id: gradle-deps
        uses: actions/cache@v4
        with:
          path: D:\a\.gradle\caches\modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Resolve CI dependencies
        if: steps.gradle-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
            & .\gradlew.bat --no-daemon resolveCiDependencies
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { throw "Dependency resolution failed after 3 attempts." }
            Start-Sleep -Seconds ($attempt * 20)
          }

  linux-full-suite:
    needs: dependency-cache-linux
    name: Certification Linux Full Suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Full tests and coverage
        run: ./gradlew --offline --no-daemon clean test jacocoTestReport jacocoTestCoverageVerification
      - name: Account tests and skips
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path build/test-results/test -Filter 'TEST-*.xml' -File
          if ($files.Count -eq 0) { throw 'No JUnit XML results found.' }
          $tests = 0; $failures = 0; $errors = 0; $skipped = 0
          foreach ($file in $files) {
            [xml]$xml = Get-Content -LiteralPath $file.FullName -Raw
            $suite = $xml.testsuite
            $tests += [int]$suite.tests
            $failures += [int]$suite.failures
            $errors += [int]$suite.errors
            $skipped += [int]$suite.skipped
          }
          "### CATGIS Linux certification" >> $env:GITHUB_STEP_SUMMARY
          "- tests: $tests" >> $env:GITHUB_STEP_SUMMARY
          "- failures: $failures" >> $env:GITHUB_STEP_SUMMARY
          "- errors: $errors" >> $env:GITHUB_STEP_SUMMARY
          "- skipped: $skipped" >> $env:GITHUB_STEP_SUMMARY
          if ($tests -lt 700) { throw "Unexpected test-count regression: $tests < 700" }
          if ($failures -ne 0 -or $errors -ne 0) { throw 'JUnit failures/errors detected.' }
          if ($skipped -gt 3) { throw "Linux skip budget exceeded: $skipped > 3" }
      - name: Upload Linux evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: certification-linux
          path: |
            catgis-desktop/build/test-results/test/
            catgis-desktop/build/reports/tests/test/
            catgis-desktop/build/reports/jacoco/
          if-no-files-found: error
          retention-days: 7

  windows-full-suite:
    needs: dependency-cache-windows
    name: Certification Windows Full Suite
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: D:\a\.gradle\caches\modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Full headless tests
        shell: pwsh
        run: .\gradlew.bat --offline --no-daemon clean test
      - name: Account Windows tests
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path build/test-results/test -Filter 'TEST-*.xml' -File
          if ($files.Count -eq 0) { throw 'No JUnit XML results found.' }
          $tests = 0; $failures = 0; $errors = 0; $skipped = 0
          foreach ($file in $files) {
            [xml]$xml = Get-Content -LiteralPath $file.FullName -Raw
            $suite = $xml.testsuite
            $tests += [int]$suite.tests
            $failures += [int]$suite.failures
            $errors += [int]$suite.errors
            $skipped += [int]$suite.skipped
          }
          "### CATGIS Windows certification" >> $env:GITHUB_STEP_SUMMARY
          "- tests: $tests" >> $env:GITHUB_STEP_SUMMARY
          "- failures: $failures" >> $env:GITHUB_STEP_SUMMARY
          "- errors: $errors" >> $env:GITHUB_STEP_SUMMARY
          "- skipped: $skipped" >> $env:GITHUB_STEP_SUMMARY
          if ($tests -lt 700) { throw "Unexpected test-count regression: $tests < 700" }
          if ($failures -ne 0 -or $errors -ne 0) { throw 'JUnit failures/errors detected.' }
          if ($skipped -gt 6) { throw "Windows skip budget exceeded: $skipped > 6" }
      - name: Upload Windows evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: certification-windows
          path: |
            catgis-desktop/build/test-results/test/
            catgis-desktop/build/reports/tests/test/
          if-no-files-found: error
          retention-days: 7

  source-feature-inventory:
    needs: dependency-cache-linux
    name: Source Feature Surface Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Certify source feature-surface inventory
        run: ./gradlew --offline --no-daemon test --tests "ar.com.catgis.architecture.FeatureSurfaceInventoryCertificationTest" --tests "ar.com.catgis.architecture.UiCommandCarrierCoverageCertificationTest" --tests "ar.com.catgis.architecture.SupplementalVisibleCommandInventoryCertificationTest"
      - name: Upload inventory evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: certification-source-feature-inventory
          path: |
            docs/quality/SOURCE_FEATURE_SURFACE_INVENTORY.tsv
            docs/quality/UI_COMMAND_CARRIER_INVENTORY.tsv
            docs/quality/SUPPLEMENTAL_VISIBLE_COMMAND_INVENTORY.tsv
          if-no-files-found: error
          retention-days: 7

  visible-command-inventory:
    needs: dependency-cache-linux
    name: Visible Command Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Certify visible command inventory
        run: ./gradlew --offline --no-daemon test --tests "ar.com.catgis.architecture.VisibleCommandInventoryCertificationTest" --tests "ar.com.catgis.architecture.StaticCommandAliasCertificationTest" --tests "ar.com.catgis.architecture.DynamicCommandInventoryCertificationTest" --tests "ar.com.catgis.architecture.SemanticFeatureMatrixCertificationTest"
      - name: Upload visible command evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: certification-visible-command-inventory
          path: |
            catgis-desktop/build/certification/visible-command-inventory.tsv
            docs/quality/STATIC_COMMAND_ALIAS_MAP.tsv
            docs/quality/DYNAMIC_COMMAND_INVENTORY.tsv
            docs/quality/MODULE_ACTION_INVENTORY.tsv
            docs/quality/STATIC_COMMAND_SEMANTIC_MAP.tsv
            docs/quality/MODULE_ACTION_SEMANTIC_MAP.tsv
            docs/quality/SURFACE_SEMANTIC_MAP.tsv
            docs/quality/SEMANTIC_FEATURE_MATRIX.tsv
          if-no-files-found: error
          retention-days: 7

  architecture-guardrails:
    needs: dependency-cache-linux
    name: Architecture Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Run executable architecture contracts
        run: ./gradlew --offline --no-daemon test --tests "ar.com.catgis.architecture.ArchitectureCertificationTest"

  postgis-real:
    needs: dependency-cache-linux
    name: PostGIS Real Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: catgis_test
          POSTGRES_USER: catgis_test
          POSTGRES_PASSWORD: catgis_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catgis_test -d catgis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: catgis-desktop
    env:
      CATGIS_TEST_POSTGIS_HOST: localhost
      CATGIS_TEST_POSTGIS_PORT: '5432'
      CATGIS_TEST_POSTGIS_DB: catgis_test
      CATGIS_TEST_POSTGIS_USER: catgis_test
      CATGIS_TEST_POSTGIS_PASSWORD: catgis_test_password
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Real PostGIS read/write roundtrip
        run: ./gradlew --offline --no-daemon postgisIntegrationTest
      - name: Upload PostGIS evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: certification-postgis
          path: catgis-desktop/build/test-results/postgisIntegrationTest/
          if-no-files-found: error
          retention-days: 7
