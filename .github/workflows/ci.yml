name: CATGIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: catgis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-cache-linux:
    name: Prime Linux dependency cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Restore bounded Gradle dependency cache
        id: gradle-deps
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Resolve CI dependencies
        if: steps.gradle-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon resolveCiDependencies; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency resolution failed after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 20))
          done

  desktop-build:
    name: Java Desktop Build & Test
    needs: dependency-cache-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: catgis-desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore bounded Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
          fail-on-cache-miss: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Checkstyle
        run: ./gradlew --offline checkstyleMain checkstyleTest

      - name: Build & Test
        run: ./gradlew --offline build jacocoTestReport

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-diagnostics
          path: |
            catgis-desktop/build/test-results/test/
            catgis-desktop/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7


  repository-safety:
    name: Repository Safety Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate history sanitation helper
        shell: pwsh
        run: |
          $path = "docs/repository/Invoke-HistorySanitization.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell parser errors in history sanitation helper."
          }

          $content = Get-Content -LiteralPath $path -Raw
          $required = 'return "literal:$Source==>$Replacement"'
          if (-not $content.Contains($required)) {
            throw "Missing required git-filter-repo ==> replacement rule."
          }

          $forbidden = @(
            '"literal:$HistoricalSourceRoot==$ReplacementSourceRoot"',
            '"literal:$historicalSourceRootForward==$ReplacementSourceRoot"'
          )
          foreach ($pattern in $forbidden) {
            if ($content.Contains($pattern)) {
              throw "Legacy invalid git-filter-repo == replacement rule detected."
            }
          }

          $pickaxeRequired = '$pickaxeArgument = "-S$Needle"'
          if (-not $content.Contains($pickaxeRequired)) {
            throw "Missing single-argument git pickaxe construction for literals with spaces."
          }

          $legacyPickaxe = @(
            'git log --all --oneline -S$HistoricalSourceRoot',
            'git log --all --oneline -S$historicalSourceRootForward'
          )
          foreach ($pattern in $legacyPickaxe) {
            if ($content.Contains($pattern)) {
              throw "Legacy unquoted PowerShell git -S invocation detected."
            }
          }

  web-lint:
    name: Web Viewer Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: catserver-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: catserver-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
