name: CATGIS GeoParquet Metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geoparquet-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-interop:
    name: GeoParquet Independent Metadata Interop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJ_NETWORK: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - name: Resolve isolated fixture path on the runner
        run: |
          echo "CATGIS_GEOPARQUET_FIXTURES=$RUNNER_TEMP/catgis-geoparquet-fixtures" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up independent fixture generator
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test-only Arrow and PROJ wheels without persistent cache
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: pyarrow==21.0.0 pyproj==3.7.2
      - name: Generate and independently reopen actual point and polygon Parquet files
        run: python tools/qa/generate_geoparquet_fixtures.py "$CATGIS_GEOPARQUET_FIXTURES"
      - name: Restore bounded shared Gradle dependency cache
        id: deps
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: catgis-gradle-deps-v1-${{ runner.os }}-${{ hashFiles('catgis-desktop/build.gradle', 'catgis-desktop/settings.gradle*', 'catgis-desktop/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Setup Gradle without additional caches
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Resolve dependencies only on a cache miss
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: catgis-desktop
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon resolveCiDependencies; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
      - name: Run Java metadata interoperability contracts
        working-directory: catgis-desktop
        run: ./gradlew --offline --no-daemon geoparquetInteropTest
      - name: Verify execution counts and unchanged source fixtures
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path('catgis-desktop/build/test-results/geoparquetInteropTest')
          suites = [ET.parse(path).getroot() for path in root.glob('TEST-*.xml')]
          totals = {key: sum(int(suite.get(key, '0')) for suite in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          print('GEOPARQUET_INDEPENDENT_INTEROP', totals)
          if totals != {'tests': 4, 'failures': 0, 'errors': 0, 'skipped': 0}:
              raise SystemExit('The complete real-file metadata contract must execute without skips.')
          fixtures = pathlib.Path(os.environ['CATGIS_GEOPARQUET_FIXTURES'])
          manifest = json.loads((fixtures / 'sha256.json').read_text(encoding='utf-8'))
          for name, expected in manifest.items():
              actual = hashlib.sha256((fixtures / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit('Fixture was modified: ' + name)
          print('SOURCE_FIXTURES_UNCHANGED', len(manifest))
          PY
      - name: Preserve failure diagnostics only, never fixture binaries
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geoparquet-metadata-failure
          path: catgis-desktop/build/test-results/geoparquetInteropTest/
          if-no-files-found: warn
          retention-days: 7
